<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
    <match target="font">
        <edit name="rgba" mode="assign">
            <const>none</const>
        </edit>
    </match>
    <match target="font">
        <edit mode="assign" name="hinting">
            <bool>true</bool>
        </edit>
    </match>
    <match target="font">
        <edit mode="assign" name="hintstyle">
            <const>hintslight</const>
        </edit>
    </match>
    <match target="font">
        <edit mode="assign" name="antialias">
            <bool>true</bool>
        </edit>
    </match>
    <dir>~/.local/share/fonts</dir>

    <!-- Prepend SF Pro strongly so Western letters always use SF Pro -->
    <match target="pattern">
        <test name="family" qual="any">
            <string>sans-serif</string>
        </test>
        <edit mode="prepend" name="family" binding="strong">
            <string>SF Pro</string>
        </edit>
    </match>

    <match target="pattern">
        <test name="family" qual="any">
            <string>system-ui</string>
        </test>
        <edit mode="prepend" name="family" binding="strong">
            <string>SF Pro</string>
        </edit>
    </match>

    <!-- Sans-serif: San Francisco (Western) -> PingFang SC (Chinese) -> Noto Sans CJK SC -->
    <alias>
        <family>sans-serif</family>
        <prefer>
            <family>SF Pro</family>
            <family>SF Pro Text</family>
            <family>SF Pro Display</family>
            <family>PingFang SC</family>
            <family>苹方-简</family>
            <family>Noto Sans CJK SC</family>
            <family>Noto Sans</family>
        </prefer>
    </alias>

    <!-- System UI: San Francisco (Western) -> PingFang SC (Chinese) -> Noto Sans CJK SC -->
    <alias>
        <family>system-ui</family>
        <prefer>
            <family>SF Pro</family>
            <family>SF Pro Text</family>
            <family>SF Pro Display</family>
            <family>PingFang SC</family>
            <family>苹方-简</family>
            <family>Noto Sans CJK SC</family>
            <family>Noto Sans</family>
        </prefer>
    </alias>

    <!-- Serif: Noto Serif first, fallback to PingFang SC -->
    <alias>
        <family>serif</family>
        <prefer>
            <family>Noto Serif CJK SC</family>
            <family>Noto Serif</family>
            <family>PingFang SC</family>
        </prefer>
    </alias>

    <!-- Monospace: JetBrainsMono (Western) -> PingFang SC (Chinese) -> Noto Sans CJK SC -->
    <alias>
        <family>monospace</family>
        <prefer>
            <family>JetBrainsMono Nerd Font</family>
            <family>JetBrains Mono NF</family>
            <family>PingFang SC</family>
            <family>苹方-简</family>
            <family>Noto Sans CJK SC</family>
        </prefer>
    </alias>
    <match target="pattern">
        <test name="family" qual="any">
            <string>monospace</string>
        </test>
        <edit mode="prepend" name="family" binding="strong">
            <string>JetBrainsMono Nerd Font</string>
        </edit>
    </match>
</fontconfig>
