$lock_cmd = hyprctl dispatch 'hl.dsp.global("quickshell:lock")' & pidof qs quickshell hyprlock || hyprlock
# $lock_cmd = pidof hyprlock || hyprlock
$suspend_cmd = systemctl suspend

general {
    lock_cmd = $lock_cmd
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.global("quickshell:lockFocus")'
    inhibit_sleep = 3
}

listener {
    timeout = 300 # 5mins
    on-timeout = bash -c '~/.config/hypr/hyprland/scripts/gamepad-active.py || loginctl lock-session'
}

listener {
    timeout = 600 # 10mins
    on-timeout = bash -c '~/.config/hypr/hyprland/scripts/gamepad-active.py || hyprctl dispatch "hl.dsp.dpms({ action = \"disable\" })"'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 900 # 15mins
    on-timeout = bash -c '~/.config/hypr/hyprland/scripts/gamepad-active.py || systemctl suspend'
}
